<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontology Lab</title>
<style>
/* @include: css/base.css */
/* @include: css/suites.css */
/* @include: css/coverage.css */
/* @include: css/framework.css */
/* @include: css/flowchart.css */
/* @include: css/interview.css */
/* @include: css/ontology.css */
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">🧬</span>
    <span>Ontology Lab</span>
    <span class="version">v1.0</span>
  </div>
  <div class="spacer"></div>
  <div class="suite-bar">
    <label for="suiteSelect">选择套件:</label>
    <select id="suiteSelect"><option value="">— 加载中… —</option></select>
    <button class="btn" id="btnRefresh" title="重新加载套件与覆盖度数据">🔄 刷新</button>
    <button class="btn" id="btnReimport" title="从 datasource 重新解析并导入（保留标注；已有套件框架保持不变，可在「流程框架」下拉中切换）">📦 重新导入</button>
    <label for="fwNewSelect" title="当前套件使用的流程框架（切换后流程地图/覆盖度按新框架展示；重新导入时新套件也使用该框架）">流程框架:</label>
    <select id="fwNewSelect" title="当前套件使用的流程框架；切换后旧框架下的实体映射需重新锚定（保留但不再参与统计）"></select>
    <button class="btn" id="btnImportFw" title="导入自定义流程框架 JSON（校验后持久化，重启后自动加载）">🗂 导入框架</button>
    <input type="file" id="fwFileInput" accept=".json,application/json" style="display:none">
  </div>
</header>

<nav class="tabs" id="tabs">
  <span class="tab-group-label">▎流程工作台</span>
  <button data-tab="framework" disabled>流程地图</button>
  <button data-tab="flowchart" disabled>流程画板<span class="tab-count" id="cntFlows">0</span></button>
  <button data-tab="interview" disabled>访谈清单<span class="tab-count" id="cntInterviews">0</span></button>
  <span class="tab-group-label">▎本体资产库</span>
  <button data-tab="ontology" class="active">本体图谱<span class="tab-count" id="cntEntities">0</span></button>
  <button data-tab="suites">套件管理<span class="tab-count" id="cntSuites">0</span></button>
  <button data-tab="coverage" disabled>覆盖度</button>
</nav>

<main>
<!-- @include: pages/suites.html -->
<!-- @include: pages/coverage.html -->
<!-- @include: pages/framework.html -->
<!-- @include: pages/flowchart.html -->
<!-- @include: pages/interview.html -->
<!-- @include: pages/ontology.html -->
</main>

<!-- 标注抽屉 -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="dt">
      <h3 id="dwTitle">—</h3>
      <div class="dsub" id="dwSub">—</div>
    </div>
    <button class="drawer-close" id="dwClose" title="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-sec">
      <h4>实体信息</h4>
      <div class="ent-desc" id="dwDesc" style="display:none"></div>
      <dl class="info-grid" id="dwInfo"></dl>
    </div>
    <div class="drawer-sec">
      <h4>框架节点编号</h4>
      <div class="domain-line" id="dwDomain" style="display:none"></div>
      <div class="apqc-box">
        <input type="text" id="dwApqc" placeholder="如 9.3.1，输入以搜索…" autocomplete="off">
        <div class="apqc-sug" id="dwSug"></div>
      </div>
      <div class="map-warn" id="dwWarn" style="display:none"></div>
      <div class="derive-line" id="dwDerive"></div>
    </div>
    <div class="drawer-sec">
      <h4>覆盖状态</h4>
      <div class="status-btns" id="dwStatus"></div>
    </div>
    <div class="drawer-sec">
      <h4>备注</h4>
      <textarea id="dwNote" placeholder="该实体属于哪个流程、口径说明等…"></textarea>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" id="dwClear" title="清除该实体的全部标注">清除标注</button>
    <button class="btn primary" id="dwSave">保存</button>
  </div>
</aside>

<div id="toast"></div>

<script>
'use strict';

</script>

</body>
</html>

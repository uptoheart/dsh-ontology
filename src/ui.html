<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-ontology</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--dsw-bg, #ffffff);
    --surface: var(--dsw-bg-inset, #f6f8fa);
    --card: var(--dsw-bg-elevated, #ffffff);
    --border: var(--dsw-border, #d0d7de);
    --border-h: var(--dsw-border-strong, #0969da);
    --text: var(--dsw-text-primary, #1f2328);
    --text-dim: var(--dsw-text-secondary, #656d76);
    --accent: var(--dsw-alias-brand-primary, #f59e0b);
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--dsw-bg, #14110f);
      --surface: var(--dsw-bg-inset, #1f1b17);
      --card: var(--dsw-bg-elevated, #1f1b17);
      --border: var(--dsw-border, #3a332a);
      --border-h: var(--dsw-border-strong, #524838);
      --text: var(--dsw-text-primary, #e8dcc8);
      --text-dim: var(--dsw-text-secondary, #8a7e6b);
      --accent: var(--dsw-alias-brand-primary, #f59e0b);
    }
  }
  html[data-theme="dark"] {
    --bg: var(--dsw-bg, #14110f);
    --surface: var(--dsw-bg-inset, #1f1b17);
    --card: var(--dsw-bg-elevated, #1f1b17);
    --border: var(--dsw-border, #3a332a);
    --border-h: var(--dsw-border-strong, #524838);
    --text: var(--dsw-text-primary, #e8dcc8);
    --text-dim: var(--dsw-text-secondary, #8a7e6b);
    --accent: var(--dsw-alias-brand-primary, #f59e0b);
  }
  html[data-theme="light"] {
    --bg: var(--dsw-bg, #ffffff);
    --surface: var(--dsw-bg-inset, #f6f8fa);
    --card: var(--dsw-bg-elevated, #ffffff);
    --border: var(--dsw-border, #d0d7de);
    --border-h: var(--dsw-border-strong, #0969da);
    --text: var(--dsw-text-primary, #1f2328);
    --text-dim: var(--dsw-text-secondary, #656d76);
    --accent: var(--dsw-alias-brand-primary, #d97706);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .placeholder-card {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 48px;
    text-align: center;
    max-width: 420px;
  }
  .placeholder-card .icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }
  .placeholder-card h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .placeholder-card p {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>🪢 Personal Ontology</h1>
<p class="subtitle">建立和管理你的个人本体论 · Building and managing your personal ontology</p>

<div class="placeholder">
  <div class="placeholder-card">
    <div class="icon">🕸️</div>
    <h2>Coming Soon</h2>
    <p>Ontology features are under construction. The plugin scaffolding is ready — sidebar entry, panel frame, and server are wired up.</p>
  </div>
</div>

<script>
try {
  if (window.parent && window.parent !== window) {
    var parentEl = window.parent.document.documentElement;
    var parentTheme = parentEl.getAttribute('data-theme') || parentEl.getAttribute('data-color-mode');
    if (parentTheme === 'dark' || parentTheme === 'light') {
      document.documentElement.setAttribute('data-theme', parentTheme);
    } else {
      var bg = getComputedStyle(parentEl).backgroundColor;
      if (bg) {
        var m = bg.match(/rgba?\((\d+)/);
        if (m && parseInt(m[1]) < 128) document.documentElement.setAttribute('data-theme', 'dark');
      }
    }
  }
} catch(e) {}
</script>

</body>
</html>
